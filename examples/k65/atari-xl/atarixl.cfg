#
# The four examples under this directory were built by the original K65 with
# `-system AtariXL -lowAddr 0x2000`, whose linker gave one bank from $2000 and
# prepended a startup stub that jumped to `main`.  This file is what says the
# same thing to ld65, and it says it without a stub: the `atari` output format
# writes the Atari executable framing itself, and its `runad` attribute puts
# the run address in the file's own RUNAD segment.  `main` is therefore
# entered by the loader, and no byte of glue is linked in to arrange it.
#
# Each `linux.k65proj` / `windows.k65proj` beside an example is kept as the
# record of how the original was built; this is how the example is built now:
#
#     cl65 -t none --no-target-lib -C ../atarixl.cfg -o main.xex \
#          main.k65 ../include/defs.k65
#
# `tests/compat/atarixl.cfg` is deliberately not shared with this. That file
# mirrors the original's memory map so an imported fixture's committed bytes
# mean the same thing there as they did there - it fills 20 KiB and produces a
# raw image - and `tests/compat.rs` requires every configuration under
# `tests/compat/` to be named by a fixture.  An example is not a fixture.
#
# ZEROPAGE is the Atari's free zero page ($0080..$00FF), and is optional
# because none of these four examples reserves anything there.

MEMORY {
    ZP:   file = "", start = $0080, size = $0080;
    MAIN: file = %O, start = $2000, size = $3000;
}

FILES {
    %O: format = atari;
}

FORMATS {
    atari: runad = main;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  optional = yes;
    CODE:     load = MAIN, type = ro;
    BSS:      load = MAIN, type = bss, optional = yes;
}
