#
# `tests/compat/k65/a2600-tutorial-03/` is the one oracle fixture the original
# built with `-system A2600` rather than the Atari XL configuration, and
# decision 2 of `plans/06-compatibility.md` counts this second memory map as
# part of the cost of vendoring it.
#
# The 2600's system script (`workdir/system_a2600.nut` in the K65 checkout)
# gives one bank of $F000..$FFFF, writes the whole 4 KiB out raw with no
# framing, and reserves the top for two fixed sections it generates itself:
# the entry stub at $FFED and the vector table at $FFF3, whose last two words
# are the NMI/RESET/IRQ vectors pointing at that stub.  Zero page is the RIOT's
# 128 bytes at $0080.
#
# K816 has no bank switching and generates no entry stub, so a fixture linked
# here is compared at the instruction sequence rather than at the cartridge
# image; the two fixed segments exist so that a K816 program which does declare
# them lands where the 2600 requires.

MEMORY {
    ZP:   start = $0080, size = $0080;
    ROM:  start = $F000, size = $1000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp, optional = yes;
    CODE:     load = ROM, type = ro;
    ENTRY:    load = ROM, type = ro, start = $FFED, optional = yes;
    VECTORS:  load = ROM, type = ro, start = $FFF3, optional = yes;
}
