#
# The oracle fixtures under `tests/compat/k65/` were compiled by the original
# with `-system AtariXL -lowAddr 0x2000`, whose linker gives one bank running
# from $2000 to $6FFF and zero-fills the gaps between sections.  This file is
# that memory map for ld65, so a row that claims K816 and the original agree
# is comparing images placed the same way.
#
# The Atari executable framing the original wraps around the image - $FFFF,
# the start and end words, and the trailing RUNAD segment - is stripped from
# the golden rather than reproduced here; it is the loader's, not the
# program's (`tests/compat/oracle.sh`).

MEMORY {
    ZP:   start = $0080, size = $0080;
    MAIN: start = $2000, size = $5000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  optional = yes;
    # `align` asks ca65 for an `.align` *inside* the segment, and ld65 warns
    # unless the segment itself is at least that aligned - it cannot know
    # that MAIN starts at $2000 and would satisfy it anyway.  256 covers
    # every boundary the fixtures use; MAIN's start is already a multiple of
    # it, so no byte moves.
    CODE:     load = MAIN, type = ro,  align = $100;
    BSS:      load = MAIN, type = bss, optional = yes;
}
