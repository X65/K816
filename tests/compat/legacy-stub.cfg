#
# The fixtures under `tests/compat/legacy-k816/` were written against the
# legacy compiler's own link stub, and their committed byte expectations start
# at address zero because of it.  This file is that stub in ld65's language, so
# an imported fixture's bytes mean the same thing here as they did there:
#
#     origin 0, `fixed_lo` at 16, `fixed_hi` at 32, everything else after.
#
# The two fixed segments are optional - most fixtures declare neither, and a
# missing segment must not be a link failure.

MEMORY {
    ZP:   start = $0000, size = $0010;
    MAIN: start = $0000, size = $10000, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  optional = yes;
    FIXED_LO: load = MAIN, type = ro,  start = $0010, optional = yes;
    FIXED_HI: load = MAIN, type = ro,  start = $0020, optional = yes;
    CODE:     load = MAIN, type = ro;
    BSS:      load = MAIN, type = bss, optional = yes;
}
