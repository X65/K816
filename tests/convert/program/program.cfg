MEMORY {
    ZP:  start = $0000, size = $0100;
    RAM: start = $0200, size = $3000;
    ROM: start = $8000, size = $7FF0, file = %O;
    VEC: start = $FFF0, size = $0010, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    DISPLAY:  load = RAM, type = bss, optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    VECTORS:  load = VEC, type = ro;
}
