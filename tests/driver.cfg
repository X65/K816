#
# `tests/driver.rs` links every corpus program twice - once by hand, once
# through `cl65` - and requires the two images to be identical.  Most corpus
# sources are language fixtures with no product behind them and therefore no
# memory map of their own, so they are linked here.  This file is not a
# machine: it exists so that both halves of that comparison are placed the
# same way, and the only thing it has to get right is that *every* segment a
# corpus program can emit has somewhere to go.  A missing one would fail the
# link rather than the comparison, which would say nothing about the driver.
#
# The segment list is derived from the corpus rather than remembered: compile
# every program and collect its `.segment` directives.  Today that is CODE
# (the unit default), ZEROPAGE (the direct-page pool), and BSS, INFO, RELOC
# and VECTORS, which four sources name.  All but CODE are optional, because
# almost no program emits all six.
#
# Programs the corpus builds for a real machine - `examples/fullstack`, the
# Atari examples, and every compat fixture - are linked against their own
# configuration instead, and this file is not shared with them.  Fixtures are
# also checked by `tests/compat.rs` against the three configurations under
# `tests/compat/`, whose names a fixture header states.

MEMORY {
    ZP:   start = $0000, size = $0100;
    MAIN: start = $0200, size = $FE00, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  optional = yes;
    # `align` asks ca65 for an `.align` *inside* a segment, and ld65 refuses
    # it unless the segment is at least that aligned.  $100 is the largest
    # alignment any corpus program asks for, and MAIN starts on a multiple of
    # it, so no byte moves for the programs that ask for nothing.
    CODE:     load = MAIN, type = ro,  align = $100;
    RELOC:    load = MAIN, type = ro,  align = $100, optional = yes;
    INFO:     load = MAIN, type = ro,  optional = yes;
    VECTORS:  load = MAIN, type = ro,  optional = yes;
    BSS:      load = MAIN, type = bss, optional = yes;
}
