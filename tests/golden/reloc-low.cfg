# The relocation gate's first layout. `native-reloc.k816` must emit the same
# assembly against this and against reloc-high.cfg, and link to different
# bytes.
MEMORY {
    MAIN: start = $8000, size = $4000, file = %O;
}
SEGMENTS {
    CODE:  load = MAIN, type = ro;
    RELOC: load = MAIN, type = ro, align = 4;
}
