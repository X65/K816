MEMORY {
    ZP:   start = $0000, size = $0100;
    RAM:  start = $0200, size = $1E00;
    MAIN: start = $8000, size = $8000, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  optional = yes;
    BSS:      load = RAM,  type = bss, optional = yes;
    CODE:     load = MAIN, type = ro;
}
