# Generation fingerprint for the committed Tree-sitter artifacts.
#
# `cargo test --test corpus` re-hashes every file listed here and fails when
# a hash differs, so editing `grammar.js` without regenerating cannot pass
# quietly. Regenerate with `npx tree-sitter-cli@0.26 generate` in
# `tree-sitter-k65/`, then refresh this file with
# `UPDATE_GENERATED_LOCK=1 cargo test --test corpus`.
#
# `editors/zed-k816/extension.toml` pins a commit whose files must hash
# to these values (`tests/zed.rs`), so after regenerating, commit, then
# move that `rev` to the commit — a regeneration is two commits.
#
# Hashes are FNV-1a/64 over the raw file bytes.

tree-sitter-cli = 0.26
grammar.js = 101ddd5f7bd5c6ea
src/parser.c = f52aaf11ac263056
src/grammar.json = 56080d27a4c810e1
src/node-types.json = de4b4494a1ea6d6a
src/scanner.c = 4728e852d9fd1b2c
